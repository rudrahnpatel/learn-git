<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f0f6ff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14141c" media="(prefers-color-scheme: dark)">
  <!-- Theme before first paint (no flash): "light" / "dark" pin it; anything else follows the system. -->
  <script>try { var t = localStorage.getItem('learn-git:theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <!-- Bought accent before first paint too, so it doesn't flash the default violet on boot. -->
  <script>try { var a = localStorage.getItem('learn-git:accent'); if (a && /^[a-z-]{1,24}$/.test(a)) document.documentElement.setAttribute('data-accent', a); } catch (e) {}</script>
  <meta name="description" content="Learn git in three-minute lessons: a winding path, a live repo, a streak to keep alive, and Twig to cheer you on.">
  <title>learn-git</title>
